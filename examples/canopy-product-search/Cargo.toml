[package]
name    = "example-canopy-product-search"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "canopy-product-search"
path = "src/main.rs"

[dependencies]
arcanum-engine     = { path = "../../arcanum-engine" }
arcanum-server     = { path = "../../arcanum-server" }
arcanum-core       = { path = "../../arcanum-core" }
arcanum-vector     = { path = "../../arcanum-vector" }
arcanum-models     = { path = "../../arcanum-models" }
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http         = { version = "0.5", features = ["fs"] }
axum               = { version = "0.7", features = ["ws", "macros"] }
anyhow             = "1"
