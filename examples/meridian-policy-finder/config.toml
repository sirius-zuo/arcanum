[global]
runtime_mode = "development"

[retrieval]
orchestration_mode = "QueryClassified"
top_k              = 6

[embedding]
provider = "ollama"
model_id  = "nomic-embed-text"

[ingestion]
worker_pool_size = 2
queue_capacity   = 100

[ingestion.docling.backend]
type         = "http"
base_url     = "http://localhost:5001"
timeout_secs = 300
