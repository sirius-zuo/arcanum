[package]
name    = "example-folio-library-search"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "folio-library-search"
path = "src/main.rs"

[dependencies]
arcanum-engine     = { path = "../../arcanum-engine" }
arcanum-server     = { path = "../../arcanum-server" }
arcanum-core       = { path = "../../arcanum-core" }
arcanum-vector     = { path = "../../arcanum-vector" }
arcanum-models     = { path = "../../arcanum-models" }
arcanum-graph      = { path = "../../arcanum-graph" }
arcanum-tree       = { path = "../../arcanum-tree" }
arcanum-ingestion  = { path = "../../arcanum-ingestion" }
arcanum-evidence   = { path = "../../arcanum-evidence" }
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
arcanum-telemetry = { path = "../../arcanum-telemetry" }
tower-http         = { version = "0.5", features = ["fs"] }
axum               = "0.7"
anyhow             = "1"
