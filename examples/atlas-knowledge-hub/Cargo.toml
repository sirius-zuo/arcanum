[package]
name    = "example-atlas-knowledge-hub"
version = "0.1.0"
edition = "2021"

[lib]
name = "atlas"
path = "src/lib.rs"

[[bin]]
name = "atlas-knowledge-hub"
path = "src/main.rs"

[dependencies]
arcanum-engine     = { path = "../../arcanum-engine" }
arcanum-server     = { path = "../../arcanum-server" }
arcanum-core       = { path = "../../arcanum-core" }
arcanum-vector     = { path = "../../arcanum-vector" }
arcanum-models     = { path = "../../arcanum-models" }
arcanum-graph      = { path = "../../arcanum-graph" }
arcanum-tree       = { path = "../../arcanum-tree" }
arcanum-ingestion  = { path = "../../arcanum-ingestion" }
arcanum-evidence   = { path = "../../arcanum-evidence" }
arcanum-eval       = { path = "../../arcanum-eval" }
arcanum-mcp        = { path = "../../arcanum-mcp" }
arcanum-middleware = { path = "../../arcanum-middleware" }
arcanum-telemetry  = { path = "../../arcanum-telemetry" }
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tower-http         = { version = "0.5", features = ["fs"] }
axum               = "0.7"
anyhow             = "1"
reqwest            = { version = "0.12", features = ["json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
rand               = "0.8"
chrono             = { version = "0.4", features = ["serde"] }
tower              = { version = "0.4", features = ["util"] }
async-trait        = "0.1"
http               = "1"

[dev-dependencies]
tempfile    = "3"

[workspace]

# Keep the example's build output small: it pulls in LanceDB and the full engine, and its
# debug info alone runs to many GB.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
