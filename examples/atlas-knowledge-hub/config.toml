[global]
runtime_mode = "development"

[retrieval]
orchestration_mode  = "ParallelFusion"
fusion_strategy     = "Rrf"
strategy_timeout_ms = 600
top_k               = 15

[embedding]
provider = "ollama"
model_id  = "nomic-embed-text"

[storage]
graph_enabled = true
tree_enabled  = true

[ingestion]
pipeline         = "full"
worker_pool_size = 2
queue_capacity   = 100

[ingestion.docling.backend]
type         = "http"
base_url     = "http://localhost:5001"
timeout_secs = 300

[tree]
raptor_max_depth    = 3
raptor_cluster_size = 10

[context]
default_token_budget = 4000
default_candidate_k  = 50
rewrite_max_messages = 6

[generate]
default_generator = "local"

[generate.generators.local]
protocol          = "openai_compatible"
model             = "qwen2.5"
base_url          = "http://localhost:11434/v1"
max_output_tokens = 1024

[verify]
judge = "local"
