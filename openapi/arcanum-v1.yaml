openapi: 3.0.3
info:
  title: Arcanum API
  version: v1
  description: |
    Arcanum ingestion and retrieval API. This document covers the durable
    ingestion-operation routes added by Plan 05 Task 4: enhanced submission
    (`POST /api/v1/ingestion-operations`), durable query by id and by
    idempotency key, and idempotent collection/source removal. The legacy
    `/ingest` and `/upload` routes are preserved for a deprecation window.
    `POST /api/v1/context` assembles a token-budgeted, citable context
    package (passages plus background summaries) for a query or conversation.

    All routes require a Bearer API key (`Authorization: Bearer <token>`).
    Durable operation state is the system of record; WebSocket events are a
    latency optimization and their loss never changes query results.

security:
  - bearerAuth: []

paths:
  /api/v1/ingestion-operations:
    post:
      operationId: submitIngestionOperation
      summary: Submit a durable ingestion operation (multipart metadata + payload)
      description: |
        Accepts `multipart/form-data` with a `metadata` JSON part (deserialized
        to `IngestionSubmission`) and an optional `payload` binary part. Inline
        payload bytes are staged into the durable payload store before the
        operation is persisted, so an `Accepted` operation survives restart and
        the stored submission hash is reconstructable from the store alone.

        The submission carries payload XOR `payload_locator`:
        - `metadata` + `payload` part → inline bytes are staged.
        - `metadata.payload_locator` names a retrievable durable location.

        Returns 202 for a new operation and 200 for an idempotent replay
        (identical submission under the same `idempotency_key`). A different
        submission under the same key is a 409 conflict.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  type: string
                  format: json
                  description: JSON-encoded IngestionSubmission.
                payload:
                  type: string
                  format: binary
                  description: Inline payload bytes (optional; XOR with payload_locator).
      responses:
        '202':
          description: New operation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '200':
          description: Idempotent replay — the original operation is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '400':
          description: Malformed metadata, duplicate/unknown parts, or payload XOR violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: The caller cannot access the submission's collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The idempotency key was already used by a different submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Payload exceeds the configured maximum upload size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      operationId: getOperationByIdempotencyKey
      summary: Query an operation by idempotency key
      description: |
        Requires EXACTLY one `idempotency_key` query value. Collection access
        is enforced against the resolved operation. Returns the canonical
        `IngestionOperation` document.
      parameters:
        - name: idempotency_key
          in: query
          required: true
          description: The stable idempotency key assigned by the caller.
          schema:
            type: string
      responses:
        '200':
          description: The canonical operation document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionOperation'
        '400':
          description: Zero or multiple idempotency_key query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller cannot access the operation's collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No operation exists for the idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/ingestion-operations/{id}:
    get:
      operationId: getIngestionOperation
      summary: Query a durable operation by id
      description: |
        Returns the canonical `IngestionOperation` document. Only safe,
        redacted error details (code + message + retryability) are exposed;
        internal stack and connection details are never surfaced.
      parameters:
        - name: id
          in: path
          required: true
          description: Operation UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The canonical operation document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller cannot access the operation's collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Unknown operation id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/collections/{collectionId}/sources:
    delete:
      operationId: deleteCollectionSource
      summary: Idempotently remove a source from one collection
      description: |
        Deletes the vector, graph, and tree entries for the stable source URI
        within the collection and marks the collection-scoped document versions
        deleted per the version-store contract. Repeating removal for an absent
        source returns success (idempotent).
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
        - name: source_uri
          in: query
          required: true
          description: The stable logical source URI to remove.
          schema:
            type: string
      responses:
        '204':
          description: Removal succeeded (or was a no-op for an absent source).
        '400':
          description: The required source_uri query parameter is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller cannot access the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: A backing store failed during removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/context:
    post:
      summary: Assemble a token-budgeted context package
      description: |
        Retrieves candidates for the query (or the last user message of a
        conversation, rewritten into a standalone query), then packs, merges
        and numbers passages and background summaries within the token budget.
        Exactly one of `query` or `messages` is required. `ref_id` values are
        valid only within one response; verify traces through `chunk_ids`.
        Requires a chunk registry, otherwise 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRequest'
      responses:
        '200':
          description: The assembled context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          description: Malformed body or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller cannot access the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error during retrieval or source hydration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: >-
            Context assembly is unavailable: no chunk registry is configured
            (`context requires a chunk registry`), the vector-store circuit
            breaker is open (`circuit open: vector store unavailable`), or no
            retrieval strategy returned candidates (`retrieval unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/generate:
    post:
      summary: Generate a grounded answer with inline citations
      description: |
        Assembles context as `/api/v1/context` does, then asks the configured
        generator for an answer that cites passages as `[P1]`. Citations map
        each marker back to its passage, chunks and document version. When
        `stream` is true the response is `text/event-stream` with the events
        `context` (the context response), `delta` (`{"text"}`), then exactly
        one `done` (outcome without `answer` and `context`) or `error`
        (`{"error"}`). Failures before the first event are JSON `ErrorBody`.
        An upstream failure after the stream has started arrives as an
        `error` event. Upstream failures (502) always carry the fixed text
        `generation failed`; the detail is logged server-side. When no context is found, `status` is `no_context` and
        the generator is not called. Requires a configured generator and a
        chunk registry, otherwise 503.

        With `verify: true` the finished answer is also checked as
        `/api/v1/verify` does, using the default judge and non-strict
        citations. Without a configured judge the request fails with 503
        (`verification requires a configured judge and a chunk registry`)
        before any generation. The JSON response gains `verification`:
        absent when `verify` is false, `null` when there was no context, a
        `Verification` object otherwise. A judge failure never changes the
        answer; it surfaces as `{"status": "error", "code", "message"}`. In
        the stream a `verification` event follows `done` (data `null` when
        there was no context). Verification limits apply: a context with
        more passages than `verify.max_passages`, or passages over the judge
        input budget, yields an `invalid` verification error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: The generated answer (JSON) or an event stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events in order: `context` (ContextResponse JSON),
                  zero or more `delta` (`{"text": string}`), then one `done`
                  (GenerateOutcome JSON) or one `error` (`{"error": string}`).
                  When the request set `verify: true` and generation succeeded,
                  one final `verification` event follows `done` (Verification
                  JSON, or `null` when there was no context).
        '400':
          description: Malformed body, failed validation or unknown generator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller cannot access the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: The generator failed or its stream ended early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: >-
            No generator or chunk registry is configured
            (`generation requires a configured generator and a chunk registry`),
            the generator circuit breaker is open, or context assembly is
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '504':
          description: The generator exceeded its first-token or total timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/verify:
    post:
      summary: Verify an answer sentence by sentence against passages
      description: |
        Splits the answer into sentences, attributes `[P1]` style citations to
        each sentence, hydrates the named passages from the chunk registry
        (joining each passage's chunks into one source slice) and asks a judge
        model to check every sentence against all passages. Each supporting
        quote is located in the source and reported with its chunk, document
        version and byte range. `passages` accepts the passage objects returned
        by `/api/v1/context` unchanged; only `ref_id` and `chunk_ids` are read.
        A passage with a chunk that no longer exists is listed in
        `passages_unavailable` and is not shown to the judge. The overall
        `verdict` is `fail` when any sentence is `partial` or `unsupported`;
        with `strict_citations` it also fails on `miscited` and
        `uncited_supported`. Requires a configured judge and a chunk registry,
        otherwise 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: The verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: >-
            Malformed body, failed validation, unknown judge, a chunk outside
            the collection, a passage spanning several document versions or
            with non-contiguous chunks, passages over the judge input budget
            (`passages exceed the judge input budget`), or an answer needing
            more than 25 judge batches (`answer needs too many judge batches`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller cannot access the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error, for example registry text that does not match its recorded byte range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: >-
            The judge request failed (`judge request failed`) or returned
            invalid output after one retry (`judge returned invalid output`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: >-
            No judge or chunk registry is configured
            (`verification requires a configured judge and a chunk registry`)
            or the judge circuit breaker is open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '504':
          description: The judge exceeded its timeout (`judge timed out`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Legacy routes preserved during the deprecation window ────────────────
  /api/v1/ingest:
    post:
      deprecated: true
      summary: Legacy JSON ingestion submission
      description: Preserved for the deprecation window; Core does not use it.
      responses:
        '202':
          description: Accepted (legacy).
  /api/v1/upload:
    post:
      deprecated: true
      summary: Legacy raw-bytes upload
      description: Preserved for the deprecation window; Core does not use it.
      responses:
        '202':
          description: Accepted (legacy).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    OperationId:
      type: string
      format: uuid
      description: Stable identifier for a durable ingestion operation.
    CollectionId:
      type: string
      description: Stable collection identifier.
    OperationStatus:
      type: string
      enum: [Accepted, Running, Succeeded, Failed]
      description: Lifecycle of a durable operation. Accepted or queued is not success.
    IngestionOutcome:
      type: string
      enum: [Ingested, Unchanged]
      description: What a terminal Succeeded report means for the original content.
    PartialOutputDisposition:
      type: string
      enum: [Discarded, Isolated]
      description: How partially-written outputs were handled on failure.
    SafeOperationError:
      type: object
      description: Redacted error — no internal stack or connection details.
      properties:
        code:
          type: string
          example: QUEUE_REJECTED
        message:
          type: string
        retryable:
          type: boolean
      required: [code, message, retryable]
    IngestionReport:
      type: object
      description: |
        The canonical terminal report. A Succeeded report MUST carry the
        version-specific original-content URI.
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/OperationStatus'
        outcome:
          $ref: '#/components/schemas/IngestionOutcome'
        content_uri:
          type: string
          nullable: true
          description: Version-specific original-content URI on success/unchanged.
        error:
          $ref: '#/components/schemas/SafeOperationError'
        partial_output_disposition:
          $ref: '#/components/schemas/PartialOutputDisposition'
      required: [operation_id, status]
    IngestionSubmission:
      type: object
      description: |
        What Core submits to start a durable ingestion operation. The logical
        source URI is stable and is never replaced by a filename or staging key.
        Payload is XOR `payload_locator`: exactly one is set on submission.
      properties:
        idempotency_key:
          type: string
          description: Stable caller-assigned idempotency key.
        logical_source_uri:
          type: string
          description: Stable logical source URI.
        mime_hint:
          type: string
          nullable: true
          description: Optional MIME hint; Arcanum's byte detector is authoritative.
        collection_id:
          $ref: '#/components/schemas/CollectionId'
        pipeline_configuration:
          type: object
          description: 'Pipeline configuration, e.g. { "template": "standard" }.'
        payload:
          type: array
          items:
            type: integer
          nullable: true
          description: Inline payload bytes as a JSON byte array (never returned by query routes).
        payload_locator:
          type: string
          nullable: true
          description: Durable locator for an already-staged payload.
      required: [idempotency_key, logical_source_uri, collection_id, pipeline_configuration]
    IngestionOperation:
      type: object
      description: The canonical, queryable document for a durable operation.
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        submission:
          $ref: '#/components/schemas/IngestionSubmission'
        status:
          $ref: '#/components/schemas/OperationStatus'
        accepted_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        terminal_report:
          $ref: '#/components/schemas/IngestionReport'
      required: [operation_id, submission, status, accepted_at]
    OperationAccepted:
      type: object
      description: Response body for a successful submission.
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        status:
          type: string
          example: accepted
        resource:
          type: string
          description: Link to the durable operation resource.
          example: /api/v1/ingestion-operations/3fa85f64-5717-4562-b3fc-2c963f66afa6
      required: [operation_id, status, resource]
    ContextMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    ContextRequest:
      type: object
      properties:
        collection_id:
          type: string
        query:
          type: string
          description: Exactly one of query or messages.
        messages:
          type: array
          minItems: 1
          description: Conversation history. The last message must have role user.
          items:
            $ref: '#/components/schemas/ContextMessage'
        token_budget:
          type: integer
          minimum: 200
          description: Total token budget. Defaults from config (4000).
        background_share:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.2
          description: Share of the budget for background summaries. 0 disables them.
        candidate_k:
          type: integer
          minimum: 1
          maximum: 200
          description: Candidates per strategy. Defaults from config (50).
        render:
          type: string
          enum: [numbered, xml, markdown]
          description: When set, the response includes a rendered string.
      required: [collection_id]
    ContextPassage:
      type: object
      properties:
        ref_id:
          type: string
          example: P1
        document_id:
          type: string
        version_num:
          type: integer
        source_uri:
          type: string
        snapshot_uri:
          type: string
        canonical_uri:
          type: string
          nullable: true
        section:
          type: string
          nullable: true
        page:
          type: integer
          nullable: true
        offset_start:
          type: integer
        offset_end:
          type: integer
        text:
          type: string
        chunk_ids:
          type: array
          items:
            type: string
        strategies:
          type: array
          items:
            type: string
            example: vector
        score:
          type: number
      required: [ref_id, document_id, version_num, source_uri, offset_start, offset_end, text, chunk_ids, strategies, score]
    ContextBackground:
      type: object
      description: A background summary. Not citable.
      properties:
        ref_id:
          type: string
          example: S1
        text:
          type: string
        level:
          type: integer
        document_id:
          type: string
        covers:
          type: array
          items:
            type: string
        score:
          type: number
      required: [ref_id, text, level, document_id, covers, score]
    ContextUsage:
      type: object
      properties:
        budget:
          type: integer
        used:
          type: integer
        passages:
          type: integer
        background:
          type: integer
        dropped_passages:
          type: integer
        counter:
          type: string
          example: approx_cl100k
      required: [budget, used, passages, background, dropped_passages, counter]
    ContextRetrieval:
      type: object
      properties:
        queries:
          type: array
          items:
            type: string
        strategies_ok:
          type: array
          items:
            type: string
        strategies_failed:
          type: array
          items:
            type: object
            properties:
              strategy:
                type: string
              reason:
                type: string
            required: [strategy, reason]
      required: [queries, strategies_ok, strategies_failed]
    ContextResponse:
      type: object
      properties:
        resolved_query:
          type: string
        resolved_query_source:
          type: string
          enum: [original, rewritten, fallback]
        passages:
          type: array
          items:
            $ref: '#/components/schemas/ContextPassage'
        background:
          type: array
          items:
            $ref: '#/components/schemas/ContextBackground'
        usage:
          $ref: '#/components/schemas/ContextUsage'
        retrieval:
          $ref: '#/components/schemas/ContextRetrieval'
        rendered:
          type: string
          description: Present only when render was requested.
      required: [resolved_query, resolved_query_source, passages, background, usage, retrieval]
    GenerateRequest:
      type: object
      properties:
        collection_id:
          type: string
        mode:
          type: string
          enum: [answer, summarize]
          default: answer
        query:
          type: string
          description: Exactly one of query or messages.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContextMessage'
        generator:
          type: string
          description: Generator name. Defaults to the configured default_generator.
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
        instructions:
          type: string
          maxLength: 2000
          description: Extra caller instructions appended to the system prompt.
        context:
          type: object
          properties:
            token_budget:
              type: integer
              minimum: 200
            background_share:
              type: number
              minimum: 0.0
              maximum: 1.0
            candidate_k:
              type: integer
              minimum: 1
              maximum: 200
        stream:
          type: boolean
          default: false
          description: When true, respond with text/event-stream.
        verify:
          type: boolean
          default: false
          description: >-
            When true, verify the finished answer against the context passages
            (see `verification` on the response). Requires a configured judge.
      required: [collection_id]
    GenerateCitation:
      type: object
      properties:
        ref_id:
          type: string
        chunk_ids:
          type: array
          items:
            type: string
        document_id:
          type: string
        version_num:
          type: integer
        source_uri:
          type: string
        offset_start:
          type: integer
        offset_end:
          type: integer
        answer_spans:
          type: array
          description: Byte offsets (start, end) of each marker in the answer.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
      required: [ref_id, chunk_ids, document_id, version_num, source_uri, offset_start, offset_end, answer_spans]
    GenerateOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [ok, no_context]
        citations:
          type: array
          items:
            $ref: '#/components/schemas/GenerateCitation'
        unknown_refs:
          type: array
          items:
            type: string
        stop_reason:
          type: string
          enum: [end_turn, max_tokens, other]
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
              nullable: true
            output_tokens:
              type: integer
              nullable: true
        generator:
          type: object
          properties:
            name:
              type: string
            model:
              type: string
          required: [name, model]
      required: [status, citations, unknown_refs, stop_reason, usage, generator]
    GenerateResponse:
      allOf:
        - $ref: '#/components/schemas/GenerateOutcome'
        - type: object
          properties:
            answer:
              type: string
            context:
              $ref: '#/components/schemas/ContextResponse'
            verification:
              nullable: true
              description: >-
                Present only when the request set `verify: true`. `null` when
                there was no context to verify against.
              allOf:
                - $ref: '#/components/schemas/Verification'
          required: [answer, context]
    VerifyRequest:
      type: object
      properties:
        collection_id:
          type: string
        answer:
          type: string
          description: The answer to check, with `[P1]` style citations. At most `verify.max_answer_chars` (default 20000) characters.
        passages:
          type: array
          minItems: 1
          maxItems: 50
          description: >-
            Passages the answer may rely on. Context passage objects are
            accepted unchanged; unknown fields are ignored.
          items:
            type: object
            properties:
              ref_id:
                type: string
                pattern: '^P[0-9]{1,3}$'
                description: Unique within the request.
              chunk_ids:
                type: array
                minItems: 1
                items:
                  type: string
                description: Chunks of one document version that join contiguously.
            required: [ref_id, chunk_ids]
        judge:
          type: string
          description: Judge generator name. Defaults to `verify.judge`.
        strict_citations:
          type: boolean
          default: false
          description: Also fail the overall verdict on `miscited` and `uncited_supported` sentences.
      required: [collection_id, answer, passages]
    VerifyEvidence:
      type: object
      properties:
        ref_id:
          type: string
        chunk_id:
          type: string
        document_id:
          type: string
        version_num:
          type: integer
        version_status:
          type: string
          enum: [active, superseded, deleted, unknown]
        source_uri:
          type: string
        offset_start:
          type: integer
          description: Byte offset into the source document version.
        offset_end:
          type: integer
        quote:
          type: string
        quote_matched:
          type: boolean
          description: >-
            False when the judge's quote was not found in the passage; the
            range then covers the whole passage.
      required: [ref_id, chunk_id, document_id, version_num, version_status, source_uri, offset_start, offset_end, quote, quote_matched]
    VerifyClaim:
      type: object
      properties:
        text:
          type: string
        supported:
          type: boolean
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/VerifyEvidence'
      required: [text, supported, evidence]
    VerifySentence:
      type: object
      properties:
        span:
          type: array
          minItems: 2
          maxItems: 2
          description: Byte offsets (start, end) of the sentence in the answer.
          items:
            type: integer
        text:
          type: string
        verdict:
          type: string
          enum: [supported, miscited, uncited_supported, partial, unsupported, no_claim]
        cited:
          type: array
          description: Valid passage refs cited by the sentence.
          items:
            type: string
        invalid_refs:
          type: array
          description: Cited refs that name no available passage.
          items:
            type: string
        claims:
          type: array
          items:
            $ref: '#/components/schemas/VerifyClaim'
      required: [span, text, verdict, cited, invalid_refs, claims]
    VerifyResponse:
      type: object
      properties:
        verdict:
          type: string
          enum: [pass, fail]
        strict_citations:
          type: boolean
        counts:
          type: object
          properties:
            supported:
              type: integer
            miscited:
              type: integer
            uncited_supported:
              type: integer
            partial:
              type: integer
            unsupported:
              type: integer
            no_claim:
              type: integer
          required: [supported, miscited, uncited_supported, partial, unsupported, no_claim]
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/VerifySentence'
        passages_unavailable:
          type: array
          description: Refs of passages with a missing chunk; they were not shown to the judge.
          items:
            type: string
        judge:
          type: object
          properties:
            name:
              type: string
            model:
              type: string
          required: [name, model]
        usage:
          type: object
          description: Token counts are null when any judge call did not report them.
          properties:
            input_tokens:
              type: integer
              nullable: true
            output_tokens:
              type: integer
              nullable: true
            judge_calls:
              type: integer
          required: [input_tokens, output_tokens, judge_calls]
      required: [verdict, strict_citations, counts, sentences, passages_unavailable, judge, usage]
    Verification:
      description: >-
        Outcome of verifying a Generate answer, discriminated by `status`.
        `ok` carries a full VerifyResponse; `error` reports a judge or limit
        failure without affecting the answer.
      oneOf:
        - allOf:
            - type: object
              properties:
                status:
                  type: string
                  enum: [ok]
              required: [status]
            - $ref: '#/components/schemas/VerifyResponse'
        - type: object
          properties:
            status:
              type: string
              enum: [error]
            code:
              type: string
              enum: [invalid, forbidden, judge_unavailable, judge_upstream, judge_timeout, judge_invalid_output, internal]
            message:
              type: string
          required: [status, code, message]
      discriminator:
        propertyName: status
    ErrorBody:
      type: object
      properties:
        error:
          type: string
      required: [error]
