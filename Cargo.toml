[workspace]
members = [
    "arcanum-core",
    "arcanum-vector",
    "arcanum-graph",
    "arcanum-tree",
    "arcanum-models",
    "arcanum-ingestion",
    "arcanum-middleware",
    "arcanum-retrieval",
    "arcanum-eval",
    "arcanum-pipeline",
    "arcanum-engine",
    "arcanum-mcp",
    "arcanum-server",
    "arcanum-telemetry",
    "arcanum-chunk-eval",
    "arcanum-evidence",
]
exclude = ["examples"]
resolver = "2"

[workspace.dependencies]
async-trait  = "0.1"
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
anyhow       = "1"
uuid         = { version = "1", features = ["v4", "v5", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
tracing      = "0.1"
metrics             = "0.24"
metrics-prometheus  = "0.9"
prometheus           = "0.14"
