[package]
name    = "arcanum-ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
arcanum-core  = { path = "../arcanum-core" }
metrics       = { workspace = true }
tracing       = { workspace = true }
async-trait   = { workspace = true }
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
scraper       = "0.19"
zip           = "2"
infer         = "0.16"
reqwest       = { version = "0.12", features = ["json", "multipart"] }
rusqlite      = { version = "0.31", features = ["bundled"] }
sqlx          = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "uuid", "chrono", "json"] }
tempfile      = "3"
uuid          = { version = "1", features = ["serde", "v4"] }
chrono         = { version = "0.4", features = ["serde"] }
bytes          = "1"
futures        = "0.3"
sha2           = "0.10"
hex            = "0.4"

# No [features] section is required: the SQLite store runs in-process and the
# S3 payload adapter is driven by config — it takes an injected `S3ObjectStore`
# client, so both adapters are exercised by plain `cargo test` without a live
# MinIO endpoint or an optional `s3` feature.

[dev-dependencies]
tokio    = { workspace = true }
wiremock = "0.6"
